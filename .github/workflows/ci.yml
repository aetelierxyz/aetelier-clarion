name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  AGAVE_VERSION: "3.1.13"

jobs:

  gates:
    name: fmt + clippy + tests (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt (blocking)
        run: cargo fmt --all -- --check

      - name: cargo clippy (blocking)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo nextest (unit + integration)
        run: cargo nextest run --locked --workspace

      - name: cargo test (doc tests)
        run: cargo test --locked --workspace --doc

      - name: cargo doc (blocking)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared rust-version
        run: cargo check --locked --workspace

  deny:
    name: cargo deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  program:
    name: program (build-sbf + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/clarion

      - uses: actions/cache@v6
        id: agave
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: agave-${{ runner.os }}-${{ env.AGAVE_VERSION }}

      - name: install agave
        if: steps.agave.outputs.cache-hit != 'true'
        run: |
          installer="$(curl -sSfL --retry 3 "https://release.anza.xyz/v${AGAVE_VERSION}/install")"
          sh -c "$installer"

      - name: agave on PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: cargo clippy (blocking)
        run: cargo clippy --locked --manifest-path programs/clarion/Cargo.toml --all-targets -- -D warnings

      - name: cargo build-sbf
        run: cargo build-sbf --manifest-path programs/clarion/Cargo.toml

      - name: cargo test
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/programs/clarion/target/deploy
        run: cargo test --manifest-path programs/clarion/Cargo.toml

  ci-green:
    name: ci-green
    if: always()
    needs: [gates, msrv, deny, program]
    runs-on: ubuntu-24.04
    steps:
      - name: assert every upstream job succeeded
        run: |
          echo 'gates=${{ needs.gates.result }}'
          echo 'msrv=${{ needs.msrv.result }}'
          echo 'deny=${{ needs.deny.result }}'
          echo 'program=${{ needs.program.result }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::at least one ci job did not succeed"
            exit 1
          fi
