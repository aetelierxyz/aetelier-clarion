[workspace]

[workspace.metadata.cli]
solana = "3.1.13"

[package]
name = "clarion"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
idl = ["dep:codama"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
codama = { version = "=0.13.2", optional = true }
solana-program = "3"
solana-security-txt = "1.1.3"
solana-system-interface = { version = "2", features = ["bincode"] }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
solana-account = "3"
solana-keypair = "3"
solana-program-test = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }

[[example]]
name = "idl"
required-features = ["idl"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }

[profile.release]
overflow-checks = true
