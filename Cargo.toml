[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["programs/clarion"]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"

[workspace.dependencies]
bs58 = { version = "0.5" }
clap = { version = "4.5", features = ["derive"] }
csv = { version = "1.3" }
quinn = { version = "0.11" }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
solana-account = { version = "3" }
solana-commitment-config = { version = "3" }
solana-keypair = { version = "3" }
solana-program = { version = "3" }
solana-program-test = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-rpc-client = { version = "=3.1.12", default-features = false }
solana-sdk-ids = { version = "3" }
solana-transaction = { version = "3", features = ["bincode"] }
thiserror = { version = "1.0.64" }
tokio = { version = "1", features = ["full"] }
toml = { version = "0.8" }
tracing = { version = "0.1" }
